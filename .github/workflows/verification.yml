name: Verification acceptance

on:
  push:
    branches: [main, codex/task-lifecycle-0.32]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2022
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      # No provider credentials are needed or passed to these tests.
      AGENT_EMBEDDING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check --no-cache .
      - name: Ruff format
        run: python -m ruff format --check --no-cache .
      - name: Required real POSIX symlink acceptance
        if: runner.os == 'Linux'
        run: python -m pytest tests/test_unix_verification_acceptance.py -v -ra
      - name: Pytest including real subprocess and POSIX acceptance
        timeout-minutes: 8
        run: python -m pytest -vv -ra --durations=15 -o faulthandler_timeout=60 --junitxml=pytest-results.xml
      - name: Mypy
        run: python -m mypy src/context_agent --ignore-missing-imports
      - name: Compile
        run: python -m compileall -q src/context_agent
      - name: Build distributions
        run: python -m build --outdir .pytest-tmp/ci-dist
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-results.xml
          retention-days: 14
